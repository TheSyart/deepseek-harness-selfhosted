name: ServerOps image
run-name: ServerOps image ${{ inputs.commit || github.sha }}
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact lowercase 40-character commit SHA (empty uses event SHA)
        required: false
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: serverops-image-${{ inputs.commit || github.sha }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate requested commit
        env:
          REQUESTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Record checked-out source
        id: source
        env:
          REQUESTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$REQUESTED_COMMIT"
          source_url="$(git remote get-url origin)"
          source_url="${source_url%.git}"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "url=$source_url" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish runtime
        id: image_web
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thesyart/deepseek-harness-selfhosted:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=${{ steps.source.outputs.url }}
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.sha }}
      - name: Record trusted build proof (web)
        shell: bash
        env:
          SERVICE: web
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          IMAGE: ghcr.io/thesyart/deepseek-harness-selfhosted
          DIGEST: ${{ steps.image_web.outputs.digest }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const e = process.env;
          const checkoutSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(checkoutSha) || checkoutSha !== e.EXPECTED_SHA ||
              !/^[a-f0-9]{40}$/.test(e.GITHUB_SHA) || !/^sha256:[a-f0-9]{64}$/.test(e.DIGEST) ||
              !/^[a-z][a-z0-9-]*$/.test(e.SERVICE)) throw new Error('Invalid build proof identity');
          for (const key of ['GITHUB_RUN_ID', 'GITHUB_RUN_NUMBER', 'GITHUB_RUN_ATTEMPT']) {
            if (!/^[1-9][0-9]*$/.test(e[key]) || !Number.isSafeInteger(Number(e[key]))) throw new Error('Invalid run identity');
          }
          const proof = { version: 1, repository: e.GITHUB_REPOSITORY, workflow: 'serverops-image.yml',
            runId: Number(e.GITHUB_RUN_ID), runNumber: Number(e.GITHUB_RUN_NUMBER), runAttempt: Number(e.GITHUB_RUN_ATTEMPT),
            headSha: e.GITHUB_SHA, checkoutSha, service: e.SERVICE, image: e.IMAGE, digest: e.DIGEST };
          const directory = path.join(e.RUNNER_TEMP, 'serverops-proof-' + e.SERVICE);
          fs.mkdirSync(directory, { recursive: true });
          fs.writeFileSync(path.join(directory, 'release.json'), JSON.stringify(proof) + '\n', { mode: 0o600 });
          NODE
      - name: Upload trusted build proof (web)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: serverops-image-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/serverops-proof-web/release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
